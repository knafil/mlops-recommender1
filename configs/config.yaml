data:
  raw_path: "data/raw/ml-1m/ratings.dat"
  processed_path: "data/processed/ratings_clean.csv"
  test_size: 0.25
  random_seed: 42

model:
  name: "svd_recommender"
  seed: 42
  n_factors: 50
  n_epochs: 20
  lr_all: 0.005
  reg_all: 0.02

serving:
  host: "0.0.0.0"
  port: 8000
  threshold: 0.5
