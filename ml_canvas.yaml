probleme_business:
  description: "Recommander les 10 films les plus pertinents pour chaque utilisateur"
  utilisateurs: "Utilisateurs de la plateforme de streaming"
  valeur_ajoutee: "Augmenter le temps de visionnage et réduire le churn"

solution_ml:
  type_tache: "Ranking"
  approche: "Collaborative filtering (SVD)"
  input: "Historique de ratings utilisateur + metadata films"
  output: "Liste ordonnée de 10 films recommandés"

donnees:
  sources: "MovieLens 1M — logs de ratings utilisateurs"
  volume: "1M ratings, 6000 users, 4000 films"
  fraicheur: "Données historiques — réentraînement hebdomadaire"
  qualite: "Sparse matrix — 95% de valeurs manquantes"

metriques:
  ml:
    principale: "NDCG@10"
    garde: ["Precision@10 > 0.3", "Latence p99 < 200ms", "Diversité > 0.6"]
  business:
    principale: "CTR sur les recommandations"

contraintes:
  latence_max_ms: 200
  throughput_qps: 1000
  memoire_mb: 512
  cout_max: "Edge deployment — pas de GPU"

risques:
  biais: "Popularité bias — surreprésentation des films populaires"
  drift: "Évolution des goûts utilisateurs dans le temps"
  securite: "Données utilisateurs sensibles — RGPD"

pipeline:
  mode: "Hybride — batch training + online serving"
  frequence_reentrain: "Hebdomadaire ou sur détection de drift"
  strategie_deploiement: "Canary — 10% du trafic d’abord"
