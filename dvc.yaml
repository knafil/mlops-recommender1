stages:
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - configs/config.yaml
      - data/raw/ml-1m/ratings.dat
      - data/raw/ml-1m/movies.dat
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
    metrics:
      - data/processed/metrics.json:
          cache: false

  validate:
    cmd: python src/data/validate.py
    deps:
      - src/data/validate.py
      - data/processed/train.csv
    metrics:
      - data/processed/validation_report.json:
          cache: false

  build_features:
    cmd: python src/features/build_features.py
    deps:
      - src/features/build_features.py
      - data/processed/train.csv
    outs:
      - data/features/user_features.parquet
      - data/features/movie_features.parquet
      - data/features/interaction_features.parquet
    metrics:
      - data/features/metrics.json:
          cache: false

  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - configs/config.yaml
      - data/features/user_features.parquet
      - data/features/movie_features.parquet
      - data/features/interaction_features.parquet
    outs:
      - models/recommender.pkl
    metrics:
      - models/metrics.json:
          cache: false

