stages:
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - configs/config.yaml
      - data/raw/ml-1m/ratings.dat
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  validate:
    cmd: python src/data/validate.py
    deps:
      - src/data/validate.py
      - data/processed/train.csv
    metrics:
      - data/processed/validation_report.json:
          cache: false
  build_features:
    cmd: python src/features/build_features.py
    deps:
      - src/features/build_features.py
      - data/processed/train.csv
    outs:
      - data/features/user_features.parquet
      - data/features/movie_features.parquet
  build_advanced_features:
    cmd: python src/features/build_advanced_features.py
    deps:
      - src/features/build_advanced_features.py
      - data/processed/train.csv
    outs:
      - data/features/user_embeddings.parquet
      - data/features/movie_embeddings.parquet
      - data/features/clean_features.parquet
  check_leakage:
    cmd: python src/features/check_leakage.py
    deps:
      - src/features/check_leakage.py
      - data/features/clean_features.parquet
    metrics:
      - data/features/leakage_report.json:
          cache: false
  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - configs/config.yaml
      - data/features/clean_features.parquet
    outs:
      - data/splits/train.parquet
      - data/splits/val.parquet
      - data/splits/test.parquet
    metrics:
      - data/splits/split_metrics.json:
          cache: false
  experiment:
    cmd: python src/models/experiment.py
    deps:
      - src/models/experiment.py
      - data/splits/train.parquet
      - data/splits/val.parquet
      - data/features/user_embeddings.parquet
      - data/features/movie_embeddings.parquet
    metrics:
      - models/best_run.json:
          cache: false

